<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mobile Money Chat</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="chat-app">
        <header class="nav">
            <button class="back">← <span class="badge">28</span></button>
            <div class="profile">
                <span id="emergencyBtn" class="profile-title" aria-label="Emergency">MPESA</span>
            </div>
            <div class="nav-spacer"></div>
            <button id="loginBtn" class="login-nav">Login</button>
        </header>

        <main class="chat-body" role="log" aria-live="polite">
            <div class="ts">Yesterday 4:29 PM</div>
            <div class="message received" id="output"></div>
        </main>

        <form class="dock" id="transactionForm">
            <button id="openLoginBtn" class="plus" type="button" aria-label="Add">+</button>
            <div class="input-pill">
                <input id="dataInput" placeholder="Text Message • SMS" autocomplete="off">
                <button class="mic" type="button" aria-label="Dictate">></button>
            </div>
        </form>

        <div class="login-overlay" id="loginOverlay">
            <form id="loginForm" class="login-box" data-mode="send-money" novalidate>
                <h2>New transaction</h2>

                <div class="type-switch" aria-label="Transaction type switch">
                    <button type="button" class="type-tab active" data-type="send-money">Send Money</button>
                    <button type="button" class="type-tab" data-type="paybill">Paybill</button>
                </div>

                <div class="transaction-panel active" data-panel="send-money">
                    <div class="login-section">
                        <h3>Send Money</h3>
                        <label>
                            Receiver Name
                            <input id="recipientName" type="text" value="Jane Wanjiku" required>
                        </label>
                        <label>
                            Phone Number
                            <input id="recipientPhone" type="tel" value="0712345678" required>
                        </label>
                        <label>
                            Amount
                            <input id="sendAmount" type="number" step="0.01" value="2500" required>
                        </label>
                        <label>
                            New Balance
                            <input id="sendBalance" type="number" step="0.01" value="12345.50" required>
                        </label>
                        <label>
                            Transaction Cost
                            <input id="sendCost" type="number" step="0.01" value="10" required>
                        </label>
                        <label>
                            Daily Limit
                            <input id="sendLimit" type="number" step="0.01" value="240000" required>
                        </label>
                        <label>
                            Date
                            <input id="sendDate" type="date" required>
                        </label>
                        <label>
                            Time
                            <input id="sendTime" type="time" required>
                        </label>
                    </div>
                </div>

                <div class="transaction-panel" data-panel="paybill">
                    <div class="login-section paybill-section">
                        <h3>Paybill</h3>
                        <label>
                            Reference
                            <input id="paybillRef" type="text" value="UJFLZA1WDD" required>
                        </label>
                        <label>
                            Business / School
                            <input id="paybillBusiness" type="text" value="MORINGA SCHOOL" required>
                        </label>
                        <label>
                            Account Number
                            <input id="paybillAccount" type="text" value="BTK21570" required>
                        </label>
                        <label>
                            Amount
                            <input id="paybillAmount" type="number" step="0.01" value="69999" required>
                        </label>
                        <label>
                            New Balance
                            <input id="paybillBalance" type="number" step="0.01" value="7378.59" required>
                        </label>
                        <label>
                            Transaction Cost
                            <input id="paybillCost" type="number" step="0.01" value="108" required>
                        </label>
                        <label>
                            Daily Limit
                            <input id="paybillLimit" type="number" step="0.01" value="429837" required>
                        </label>
                        <label>
                            Date
                            <input id="paybillDate" type="date" required>
                        </label>
                        <label>
                            Time
                            <input id="paybillTime" type="time" required>
                        </label>
                    </div>
                </div>

                <div class="login-actions">
                    <button type="submit">Continue</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js.js"></script>
</body>
</html>
